version: 2026.261.1747
plugin-kube:
    candy:
        version: 2026.216.1851
        description: |-
            OUT-OF-TREE charly plugin owning ALL Kubernetes cluster interaction: the
            `kube` cluster-probe check VERB, the `deploy:kubernetes` SUBSTRATE (the
            `target: kubernetes` workload deploy, F1 — `kubectl apply -k` on the
            plugin-generated Kustomize tree (`candy/plugin-kube/materialize.go`'s `materializeKustomize`, on the host)), the
            `deploy:kindcluster` SUBSTRATE (a local Kubernetes-in-Docker cluster
            provisioned by the upstream `kind` tool on the operator's container engine,
            then the same Kustomize workload), AND the k3s post-provision finalization
            (S3, FINAL/K5 unit 6 — relocated wholesale from charly/k3s_post.go: the
            guest-forward kubeconfig rewrite + the ~/.kube/config merge) the
            k3s-server / target:kubernetes deploy seam needs — a standalone Go module
            (go.mod + main.go) that speaks the Kubernetes API (client-go dynamic +
            clientcmd) over go-plugin gRPC via the charly plugin SDK
            (github.com/opencharly/sdk). charly's loader fetches this candy's repo,
            go-builds the provider binary on the HOST, and serves it OUT-OF-PROCESS
            via LocalTransport — so the k8s.io/client-go + k8s.io/apimachinery
            dependency lives HERE, out of charly's core go.mod (the goadb-analog of
            candy/plugin-adb), while `kube:` authoring stays unchanged: the
            `kube: <method>` sugar desugars to plugin/plugin_input — the method +
            every kube-exclusive modifier ride the input map, validated against
            this plugin's own #KubeInput — and dispatches through the provider
            registry exactly like a built-in (ResolveVerb → grpcProvider →
            invokeVerbProvider hands it the full desugared #Op; this plugin
            self-resolves any `cluster:` profile to a concrete kube_context itself
            now, K-wave W3a A3-phase-2 — no host pre-resolve); `target: kubernetes`
            resolves to this
            plugin's deploy:kubernetes provider over the E3b reverse channel — THIS
            plugin's own preresolve.go (F6, FINAL/K5 unit 6a; dispatched via the
            generalized deploy_preresolve.go:wireDeployPreresolver seam) resolves the
            cluster template + image Capabilities into the egress-validated Kustomize
            tree, self-loading the project PLUGIN-SIDE (K-wave W3a A3-phase-2 —
            no HostBuild round trip left in this leg), and this plugin applies it.
            Provides the full
            13-method probe surface
            (nodes/wait-nodes/pods/wait-ready/ingress/ingressclass/storageclass/
            service/lb-external-ip/addons/apply/delete/raw), the deploy:kubernetes
            substrate, PLUS the internal k3s-post-provision deploy seam (this
            plugin's own k3s_post.go: the guest-forward kubeconfig rewrite, now
            self-loading the project PLUGIN-SIDE too, then the kubeconfig merge into
            ~/.kube/config). The R10 consumers are the check-k3s bed (the `kube:`
            verb, via the k3s-server candy), the check-k8s-deploy bed (the
            deploy:kubernetes substrate), and the check-kindcluster-* beds (the
            deploy:kindcluster substrate).
        plugin:
            providers:
                - verb:kube
                - deploy:kubernetes
                - deploy:kindcluster
            source: github.com/opencharly/plugin-kube/candy/plugin-kube
            primary:
                kube: method
        plan:
            # No cluster selector, matching every sibling plugin candy's self-test
            # (plugin-adb `adb: devices`, plugin-cdp / plugin-vnc / plugin-spice
            # `status`): the step proves THIS plugin's verb dispatches through the
            # registry and reaches whatever cluster the deployment composing it already
            # points at — the ambient kubeconfig current-context, which is selection
            # rule 4 of the verb's own documented precedence and the same thing plain
            # `kubectl` does. It deliberately does NOT carry `cluster: "${DEPLOY_NAME}"`:
            # for a VM live check that variable resolves to the sanitized kind:vm ENTITY
            # name, which every bed deploying that entity SHARES, so it can only name
            # another deployment's context or none at all (see the k3s-server candy for
            # the full reasoning). A bed that needs a specific cluster names its OWN
            # kind:kubernetes profile by literal; this plugin's live cluster acceptance is
            # carried by its two R10 consumer beds.
            - check: the cluster reports at least one Ready node (the out-of-process plugin verb dispatches through the registry and probes the live cluster)
              id: kube-nodes-ready
              kube:
                method: nodes
              stdout:
                - contains: Ready
              context:
                - deploy

kind-skill:
    skill:
        name: kind
        family: kubernetes
        owner: plugin-kube
        description: |-
            The `kindcluster` deploy substrate — local Kubernetes-in-Docker clusters
            provisioned by the upstream `kind` tool (kubernetes-sigs/kind) on the
            operator's container engine (docker / rootless podman / rootless nerdctl),
            served by candy/plugin-kube's `deploy:kindcluster` provider. Use when
            authoring a `kindcluster:` cluster template or `target: kindcluster` deploy.
        triggers:
            - "kindcluster deploy / kind create cluster / local Kubernetes-in-Docker / KIND_EXPERIMENTAL_PROVIDER / a kind cluster on docker-podman-nerdctl"
        content: |
            # kindcluster — a local Kubernetes-in-Docker cluster substrate

            `kindcluster` is a `spec` substrate kind served by candy/plugin-kube's
            `deploy:kindcluster` provider. It provisions a local Kubernetes cluster as
            node CONTAINERS on the operator's container engine, via the upstream
            [`kind`](https://kind.sigs.k8s.io/) tool, then addresses it by kubeconfig
            context (`kind-<cluster>`). It is the local-cluster sibling of the
            `kubernetes:` cluster template.

            The word is `kindcluster`, NOT `kind` — the bare word collides with the
            schema's own `source: {kind: …}` discriminator and with kind's own
            `kind: Cluster` config field.

            ## The engine is charly's own engine word

            kind's provider selector (`KIND_EXPERIMENTAL_PROVIDER`) is EXACTLY charly's
            engine vocabulary — `podman` / `docker` / `nerdctl` — so the deploy's
            `engine:` field (or the resolved `engine.run`) drives it with no separate
            selector. Per-engine host preconditions:

            | Engine | Precondition |
            |--------|--------------|
            | `docker` | a reachable daemon (rootless or rootful). |
            | rootless `podman` | cgroup v2 + a `k8s-file` log driver + raised pids/inotify limits. |
            | rootless `nerdctl` | rootless containerd running (`containerd-rootless-setuptool.sh install`). |

            The `layer-kind` candy installs the pinned `kind` binary (Arch package on
            Arch, sha256-verified release asset elsewhere) + a `kind-engine-prepare`
            script that applies these preconditions idempotently.

            ## Authoring

            ```yaml
            kind-lab-cluster:
              kindcluster:
                engine: podman
                node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
                nodes:
                  - role: control-plane
                    extra_port_mappings:
                      - container_port: 30080
                        host_port: 30080
                  - role: worker

            kind-lab:
              kindcluster:
                from: kind-lab-cluster
                image: my-app          # optional workload, applied via `kubectl apply -k`
                disposable: true       # if it is a check bed
            ```

            ```bash
            charly deploy add kind-lab --target kindcluster
            kubectl --context kind-lab get nodes
            ```

            ## Probing — use `kube:`, NOT `addons`

            kind ships **kindnet** as its CNI and **no Traefik / ServiceLB**; its
            local-path provisioner lives in the `local-path-storage` namespace and the
            StorageClass is named `standard`. So `kube: addons` (which waits on the k3s
            addon stack) does NOT apply to a kind cluster. Use `nodes`, `wait-nodes`,
            `pods`, `wait-ready`, `storageclass`, and `raw` instead, against the context
            kind writes.

            ## Loading a local image

            kind nodes have their own image store, separate from the host engine's. A
            locally-built image must be loaded in — and `kind load docker-image` is
            BROKEN on podman (measured: "image not present locally" despite the image
            existing). The provider uses the engine-agnostic `kind load image-archive`
            path, so it works on docker, podman, and nerdctl.

            ## Teardown

            `kind delete cluster --name <cluster>` — engine-scoped (the provider sets
            `KIND_EXPERIMENTAL_PROVIDER`), and idempotent on a missing cluster.

            ## Related

            - `/charly-kubernetes:check-k8s` — the `kube:` cluster-probe check verb
            - `/charly-kubernetes:kubernetes` — the `kubernetes:` cluster template
            - `/charly-core:deploy` — `charly deploy add/del`
